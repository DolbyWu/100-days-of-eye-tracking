<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blink Bloom · Mouse Playground · Day 004</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050712;color:#f8eaff;font:14px system-ui,sans-serif;overflow:hidden}
header{position:fixed;inset:0 0 auto;min-height:40px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;background:#110d20;z-index:10}
header strong{color:#ffb6ef}header span{color:#d0bddf}a{color:#f2b4ff;text-decoration:none}a:hover{text-decoration:underline}
canvas{display:block;touch-action:none}body>button{display:none!important}nav{display:flex;align-items:center;gap:14px;white-space:nowrap}
nav button{font:inherit;background:#45204f;color:white;border:1px solid #9b5baf;border-radius:6px;padding:3px 10px;cursor:pointer}
#note{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);background:#110d20dc;padding:7px 14px;border-radius:20px;color:#decde7;font-size:12px;max-width:95%;text-align:center;pointer-events:none}
#error{position:fixed;inset:25% 15%;padding:24px;background:#29172b;border:1px solid #e88dc5;border-radius:12px;z-index:30}
@media(max-width:720px){header{font-size:11px;padding:8px;gap:6px}header span{display:none}#note{font-size:10px}}
</style>
</head>
<body>
<header><strong>Blink Bloom · Day 004</strong><span>Move to stroke · Click to bloom</span><nav><button id="reset" type="button">Reset</button><a href="https://github.com/DolbyWu/100-days-of-eye-tracking/tree/main/days/004-blink-bloom">Code ↗</a></nav></header>
<div id="note">Mouse simulation · move + click · R: reset · 1 / 2 / 3: patterns · Space: pause · No eye tracker required</div>
<div id="error" hidden></div>
<script>
window.addEventListener('error',event=>{const box=document.getElementById('error');box.hidden=false;box.textContent='The playground could not start. Please reload in a recent desktop browser. '+event.message;});
document.getElementById('reset').addEventListener('click',()=>location.reload());
</script>
<script src="vendor/p5.min.js"></script>
<script src="vendor/p5.neon.js"></script>
<script src="vendor/p5.neon-effects.js"></script>
<script>const neon=new NeonP5();const MAT_URL='markers.svg';</script>
<script src="../sketch.js"></script>
</body>
</html>
